<!doctype html>
<html lang="en-KE" dir="ltr">
  <head>
    <!-- ── CORE ─────────────────────────────── -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>GlimmerInk Creations | Web Design & Development · Kenya</title>

    <meta name="description" content="GlimmerInk Creations — Kenya-based freelance creative studio building premium websites, brand identities, and custom digital systems for modern businesses." />

    <meta name="author" content="Ehud Mwai — GlimmerInk Creations" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2563EB" />

    <script>
      (() => {
        try {
          const theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
          const themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute("content", theme === "dark" ? "#0F172A" : "#2563EB");
          }
        } catch (_) {}
      })();
    </script>

    <!-- ── GEO / LOCAL SEO ───────────────────── -->

    <meta name="geo.placename" content="Kenya" />
